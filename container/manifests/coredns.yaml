# Cluster DNS without kube-proxy.
#
# The packaged k3s coredns is disabled (--disable coredns in entrypoint.sh)
# because it is unusable here twice over: it reaches the apiserver via the
# kubernetes.default ClusterIP, and pods reach it via the kube-dns ClusterIP —
# and ClusterIP does not work on this kernel (see docs/FINDINGS.md §5.2).
#
# This copy routes around kube-proxy entirely:
#   - hostNetwork: true          → coredns listens on the node IP itself
#   - bind __NODE_IP__           → only the node IP, nothing else on :53
#   - KUBERNETES_SERVICE_HOST    → client-go dials the apiserver directly
#   - kubelet --cluster-dns=__NODE_IP__ (entrypoint.sh) → pods query the node IP
#
# health/ready are moved off their defaults: :8080 belongs to the kubeflare
# status server, which shares the host network namespace with this pod.
# __NODE_IP__ is substituted by entrypoint.sh at boot from cfeth0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:coredns
rules:
  - apiGroups: [""]
    resources: [endpoints, services, pods, namespaces]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        bind __NODE_IP__
        errors
        health :18080
        ready :18181
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        cache 30
        loop
        reload
        loadbalance
        forward . /etc/resolv.conf
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      serviceAccountName: coredns
      hostNetwork: true
      # Default, not ClusterFirst: this pod IS the cluster DNS. It must use the
      # VM's own resolv.conf for upstream queries, not itself.
      dnsPolicy: Default
      priorityClassName: system-cluster-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.4
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          env:
            # client-go falls back to these when in-cluster config is used; the
            # default points at the kubernetes.default ClusterIP, which this
            # kernel cannot route. Dial the apiserver on the node IP instead.
            - name: KUBERNETES_SERVICE_HOST
              value: "__NODE_IP__"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 18080
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 18181
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config-volume
          configMap:
            name: coredns
            items:
              - key: Corefile
                path: Corefile
---
# Pods reach DNS via the node IP (kubelet --cluster-dns), so this Service is not
# on the resolution path. It exists because charts and operators hardcode the
# kube-dns ClusterIP or the kube-system/kube-dns object. Because the coredns pod
# above is hostNetwork, its endpoint address IS the node IP — so once svcproxy is
# running, 10.43.0.10:53 resolves through the same listener.
apiVersion: v1
kind: Service
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
spec:
  clusterIP: 10.43.0.10
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
